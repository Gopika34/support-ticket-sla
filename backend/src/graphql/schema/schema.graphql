enum UserRole {
    REPORTER
    AGENT
}

enum TicketPriority {
    LOW
    MEDIUM
    HIGH
    URGENT
}

enum TicketStatus {
    OPEN
    IN_PROGRESS
    RESOLVED
    CLOSED
}

type User {
    id: ID!
    name: String!
    email: String!
    role: UserRole!
    createdAt: String!
    updatedAt: String!
}

type AuthPayload {
    token: String!
    user: User!
}

input RegisterInput {
    name: String!
    email: String!
    password: String!
    role: UserRole!
}

input LoginInput {
    email: String!
    password: String!
}

type Query {
    me: User
}

type Mutation {
    register(input: RegisterInput!): AuthPayload!
    login(input: LoginInput!): AuthPayload!
}